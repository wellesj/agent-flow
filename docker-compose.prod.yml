# P6：03-agent-flow 生产部署（web + nginx；无数据库）
# 用法：
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# 模型 Key 经 .env.production 注入（DEEPSEEK_API_KEY 或 LLM_* 可切换模型）
# 注意：nginx 映射宿主 8082（80 被 ChatBot、8081 被 RAG 占用；公网访问 http://IP:8082）

services:
  web:
    build:
      context: .
      # 国内网络拉不动官方 node 镜像时，在 .env.production 加：
      #   NODE_BASE=docker.1ms.run/library/node:22-alpine
      args:
        NODE_BASE: ${NODE_BASE:-node:22-alpine}
    image: agent-flow:latest
    container_name: agent-flow-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 模型（DeepSeek 默认；设置 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL 可切换）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    # web 不暴露宿主端口，只经 nginx 反代

  nginx:
    # 国内网络拉不动官方 nginx 时，在 .env.production 加：
    #   NGINX_IMAGE=docker.1ms.run/library/nginx:1.27-alpine
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: agent-flow-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8082:80"
      # 有域名 + 证书后放开 443（见 nginx/conf.d/agent-flow.conf 内注释）
      # - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
